[package]
name = "pod-artwork-desktop"
version = "0.1.3"
description = "POD Artwork Tool desktop shell"
authors = ["POD AI Print"]
edition = "2021"

[lib]
name = "pod_artwork_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
